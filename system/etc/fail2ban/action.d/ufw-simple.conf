[Definition]
actionstart =
actionstop =
actioncheck =
actionban = /usr/sbin/ufw deny from <ip> to any comment "f2b-<name>" 2>>/tmp/f2b-action.err; echo "$(date) ban <ip> rc=$?" >> /tmp/f2b-action.err
actionunban = /usr/sbin/ufw delete deny from <ip> to any 2>>/tmp/f2b-action.err; echo "$(date) unban <ip> rc=$?" >> /tmp/f2b-action.err
