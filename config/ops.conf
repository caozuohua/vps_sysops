# ==== VPS 运维配置 ====
# 修改以下变量以匹配你的实际环境，再运行 scripts/ 下的脚本

# 主机配置：可显式设置 VPS_PROFILE=gcp/azure/aws；未设置时按已知主机名自动选择。
# 在其他主机上保持为空，继续使用本文件的通用默认值。
VPS_PROFILE="${VPS_PROFILE:-}"
VPS_PROFILE_FILE="${VPS_PROFILE_FILE:-}"

# SSH 端口（如需改为非默认端口，先手动确认新端口可连通后再运行加固脚本）
SSH_PORT=22

# 允许通过防火墙的额外端口，逗号分隔，例如开放 Web 服务 "80,443"
EXTRA_ALLOW_PORTS=""

# 需要健康检查的 systemd 服务，空格分隔，例如 "docker nginx"
# Hermes Agent 网关通过 `hermes gateway install` 注册为「用户级」服务 hermes-gateway.service，
# 03_monitor.sh 会自动按 system（系统级）/ user（用户级）两级检测，无需关心注册层级。
MONITOR_SERVICES="hermes-gateway.service"

# 用户级 systemd 服务所属用户。留空时检查当前用户。
MONITOR_USER=""

# 告警阈值（百分比）
CPU_THRESHOLD=90
MEM_THRESHOLD=85
DISK_THRESHOLD=85

# 备份源目录，空格分隔，绝对路径
BACKUP_SOURCES="/etc /home"

# 备份存放目录
BACKUP_DEST="/opt/backups"

# 备份保留天数，超过自动清理
BACKUP_RETAIN_DAYS=7

# 需要用 SQLite 在线备份 API 生成一致性副本的数据库，空格分隔。
SQLITE_DATABASES=""

# 是否由备份脚本安装 /etc/logrotate.d/vps-ops。
CONFIGURE_LOGROTATE=true

# 全量运维报告输出目录（scripts/16_report.sh 使用，定时报告归档到此处）
REPORT_DIR="/tmp/vps-ops-reports"

# 飞书自定义机器人 Webhook（可选）。留空则监控脚本只在本地输出，不发送通知。
FEISHU_WEBHOOK=""

# ==== x-ui / Nginx / Let’s Encrypt（scripts/14_web_stack.sh） ====
# 域名必须已解析到此 VPS；留空时 14_web_stack 默认只显示帮助/状态。
XUI_DOMAIN=""
# x-ui 面板的本地监听端口，请按实际安装修改，禁止暴露到公网。
XUI_PANEL_PORT=2053
# 必须使用非根路径；建议使用 16 位以上随机字母数字路径。
XUI_WEB_BASE_PATH=""
XUI_DB_PATH="/etc/x-ui/x-ui.db"
LETSENCRYPT_EMAIL=""
NGINX_SITE_NAME="vps-sysops-xui"

# ==== Mem0 服务级运维（scripts/mem0.sh） ====
# 只用于状态/健康/日志检查；smoke 需要显式提供主机本地的认证文件。
MEM0_API_BASE_URL="http://100.112.88.72:8888"
MEM0_DASHBOARD_URL="http://100.112.88.72:3000"
MEM0_API_HEALTH_PATH="/docs"
MEM0_COMPOSE_DIR="/opt/mem0"
MEM0_COMPOSE_FILE="docker-compose.yml"
MEM0_COMPOSE_SERVICE="mem0"
MEM0_EXPECT_LOCAL_COMPOSE="false"
MEM0_AUTH_FILE="${MEM0_AUTH_FILE:-}"
MEM0_MONITOR_ENABLED="true"
MEM0_SMOKE_USER_ID="sysops-smoke"
MEM0_SMOKE_AGENT_ID="vps-sysops-smoke"
MEM0_SMOKE_TIMEOUT=5
MEM0_LOG_TAIL=100

# ==== 当前主机网络期望值（主机 profile 覆盖） ====
PUBLIC_IP=""
TAILSCALE_IP=""
TAILSCALE_PEER_IP=""
TAILSCALE_ALLOW_TARGETS=""
TAILSCALE_DENY_TARGETS=""
A2A_HEALTH_URL=""
EXPECTED_PUBLIC_TCP=""
EXPECTED_BLOCKED_TCP=""

# 主机 profile 必须最后加载，使其覆盖上面的通用默认值。
if [[ -n "${VPS_PROFILE_FILE}" ]]; then
  if [[ ! -r "${VPS_PROFILE_FILE}" ]]; then
    echo "VPS profile 文件不存在或不可读: ${VPS_PROFILE_FILE}" >&2
    return 1 2>/dev/null || exit 1
  fi
  # shellcheck source=/dev/null
  source "${VPS_PROFILE_FILE}"
elif [[ -z "${VPS_PROFILE}" ]]; then
  case "$(hostname -s 2>/dev/null || true)" in
    gcp-free-vps-oregon) VPS_PROFILE="gcp" ;;
    az-vps|az-free-vm) VPS_PROFILE="azure" ;;
    aws-codex-vps|ip-172-31-30-199) VPS_PROFILE="aws" ;;
  esac
fi

if [[ -z "${VPS_PROFILE_FILE}" && -n "${VPS_PROFILE}" ]]; then
  OPS_CONFIG_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
  PROFILE_FILE="${OPS_CONFIG_DIR}/hosts/${VPS_PROFILE}.conf"
  if [[ ! -r "${PROFILE_FILE}" ]]; then
    echo "VPS profile 不存在或不可读: ${PROFILE_FILE}" >&2
    return 1 2>/dev/null || exit 1
  fi
  # shellcheck source=/dev/null
  source "${PROFILE_FILE}"
  LOCAL_PROFILE_FILE="${OPS_CONFIG_DIR}/hosts/${VPS_PROFILE}.local.conf"
  if [[ -r "${LOCAL_PROFILE_FILE}" ]]; then
    # shellcheck source=/dev/null
    source "${LOCAL_PROFILE_FILE}"
  fi
fi
